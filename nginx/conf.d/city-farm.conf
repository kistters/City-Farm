
# Front
server {
    listen 80;

    server_name localhost;
    root /code;

    location / {
    	try_files $uri $uri/ /index.html;
	}

    location = /farmer { try_files /farmer.html =404; }
    location = /citizen { try_files /citizen.html =404; }

    location /dashboard {
    	try_files $uri $uri/ /dashboard.html;
	}
}


