name: City-Farm tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cityfarm
          POSTGRES_PASSWORD: cityfarm
          POSTGRES_DB: cityfarm_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U cityfarm" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r CityFarm/requirements.txt
      - name: Puzzle and persistence tests
        env:
          REDIS_HOST: localhost
          TEST_DATABASE_URL: postgresql://cityfarm:cityfarm@localhost:5432/cityfarm_test
          PYTHONPATH: CityFarm/code
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript syntax
        run: |
          node --check CityFarm/front/js/player.js
          node --check CityFarm/front/js/farmer.js
          node --check CityFarm/front/js/citizen.js
          node --check CityFarm/front/js/dashboard.js
      - name: Independent identities on the same browser
        run: node tests/test_player_identity.cjs
      - name: Citizen numeric input regression
        run: node tests/test_citizen_answer.cjs
      - name: Farmer review and cancel regression
        run: node tests/test_farmer_memory.cjs
