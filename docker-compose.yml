services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./CityFarm/front:/code:ro

  websocket:
    build: ./CityFarm
    command: ["python", "websocket.py"]
    ports:
      - "8888:8888"
    volumes:
      - ./CityFarm/code:/code:ro
      - ./tests:/tests:ro
      - ./:/workspace:ro
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
