services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./CityFarm/front:/code:ro

  websocket:
    build: ./CityFarm
    command: ["python", "websocket.py"]
    ports:
      - "8888:8888"
    volumes:
      - ./CityFarm/code:/code:ro
      - ./tests:/tests:ro
      - ./:/workspace:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cityfarm:cityfarm@postgres:5432/cityfarm
      TEST_DATABASE_URL: postgresql://cityfarm:cityfarm@postgres:5432/cityfarm_test

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cityfarm
      POSTGRES_PASSWORD: cityfarm
      POSTGRES_DB: cityfarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityfarm -d cityfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine

volumes:
  postgres_data:
